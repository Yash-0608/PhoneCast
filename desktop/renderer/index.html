<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        http-equiv="Content-Security-Policy"
        content="
            default-src 'self';
            img-src 'self' data: blob:;
            style-src 'self' 'unsafe-inline';
            script-src 'self';
            connect-src 'self' ws: wss:;
            media-src 'self' blob:;
            font-src 'self' data:;
        "
    >

    <title>PhoneCast</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>

    <div id="app"></div>


    <!--
        PhoneCast renderer is an ES module.

        The renderer itself is intentionally tiny.
        All actual functionality lives in modules.
    -->
    <script
        type="module"
        src="./renderer.js"
    ></script>

</body>

</html>
